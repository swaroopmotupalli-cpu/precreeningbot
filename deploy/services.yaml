apiVersion: v1
kind: Service
metadata:
  name: tara-backend
  labels:
    app: tara-backend
    app.kubernetes.io/part-of: tara
spec:
  type: ClusterIP
  selector:
    app: tara-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tara-agent-metrics
  labels:
    app: tara-agent
    app.kubernetes.io/part-of: tara
spec:
  # Headless service so Task 6's Prometheus ServiceMonitor/scrape can
  # discover each agent pod's /metrics endpoint individually.
  type: ClusterIP
  clusterIP: None
  selector:
    app: tara-agent
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
