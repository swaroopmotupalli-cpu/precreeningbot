apiVersion: apps/v1
kind: Deployment
metadata:
  name: tara-scorer
  labels:
    app: tara-scorer
    app.kubernetes.io/part-of: tara
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tara-scorer
  template:
    metadata:
      labels:
        app: tara-scorer
        app.kubernetes.io/part-of: tara
    spec:
      containers:
        - name: tara-scorer
          image: IMAGE_REGISTRY/tara-backend:TAG
          imagePullPolicy: IfNotPresent
          command: ["node", "src/scorer/index.js"]
          envFrom:
            - configMapRef:
                name: tara-config
          env:
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: tara-secrets, key: REDIS_URL } }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: tara-secrets, key: MONGODB_URI } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: tara-secrets, key: GEMINI_API_KEY } }
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "500m", memory: 512Mi }
      terminationGracePeriodSeconds: 30
